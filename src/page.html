<title>JP SELECT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="JP SELECT: geselecteerde nieuwe en tweedehands designermode. Hogan, Santoni, Moorer, Gran Sasso en andere Italiaanse huizen. Trade in. Step up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* JP SELECT, ontwerpsysteem
   Laag concept: een Italiaanse galerij in de middagzon. Ivoor en travertijn als ondergrond,
   houtskool voor tekst, champagne voor kleine accenten. Strakke hoeken, dunne lijnen, veel lucht.
   Bewust één (licht) thema: de site is ontworpen als ivoren boutique. */
:root{
  --ivory:#F6F3EE; --beige:#E8E0D4; --stone:#DCD2C3; --char:#242424; --taupe:#A89A88; --champ:#B89E73;
  --white:#FFFFFF; --mute:#6E675E; --line:#D9D1C4; --line2:#C9BFB0; --ok:#4A6B53; --warn:#8A5A1E;
  --f-serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-sans:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --gut:max(clamp(24px,4vw,48px),env(safe-area-inset-left,0px)); --gutr:max(clamp(24px,4vw,48px),env(safe-area-inset-right,0px));
  --wrap:1320px; --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ivory);color:var(--char);font:300 16px/1.65 var(--f-sans);letter-spacing:.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--ivory)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:1px solid var(--char);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
@media (min-width:800px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
h1,h2,h3,h4{font-family:var(--f-serif);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
.cap{font-family:var(--f-sans);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.mute{color:var(--mute)}
.sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;border:0!important;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* knoppen: rechthoekig, dun, hoofdletters */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 30px;border:1px solid var(--char);background:transparent;color:var(--char);font:500 11.5px/1 var(--f-sans);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .35s var(--ease),color .35s var(--ease),border-color .35s}
.btn:hover{background:var(--char);color:var(--ivory)}
.btn.solid{background:var(--char);color:var(--ivory)}
.btn.solid:hover{background:transparent;color:var(--char)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:transparent;color:var(--char)}
.btn.solid[disabled]:hover{background:var(--char);color:var(--ivory)}
.btn.full{width:100%}
.lnk{all:unset;cursor:pointer;font:500 11.5px/1.4 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:3px}
.lnk:focus-visible{outline:1px solid var(--char);outline-offset:4px}
.icon{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;position:relative}
.icon:focus-visible{outline:1px solid currentColor}
.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.2}
.icon .n{position:absolute;top:5px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--char);color:var(--ivory);font:500 9.5px/16px var(--f-sans);text-align:center;letter-spacing:0;padding:0 4px}

/* voorbeeldbalk */
.notice{background:var(--beige);color:#4A443C;font-size:11.5px;letter-spacing:.06em;text-align:center;padding-block:7px;padding-left:var(--gut);padding-right:var(--gutr)}

/* navigatie */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;transition:background-color .5s var(--ease),border-color .5s,backdrop-filter .5s;border-bottom:1px solid transparent}
.nav.glass{background:var(--ivory);border-bottom-color:rgba(36,36,36,.08)}
/* zwarte menubalk met wit logo */
.nav,.nav.glass{background:var(--char);color:#F6F3EE;border-bottom-color:transparent}
.nav .icon .n{background:#F6F3EE;color:var(--char)}
.nav .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:64px;gap:20px}
.nav .links{display:flex;gap:26px;flex-wrap:nowrap}
.nav .links button{all:unset;cursor:pointer;font:500 11px/1 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;padding:8px 0;position:relative;white-space:nowrap}
.nav .links button::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:currentColor;transition:right .45s var(--ease)}
.nav .links button:hover::after,.nav .links button[aria-current="page"]::after{right:0}
.nav .links button:focus-visible{outline:1px solid currentColor;outline-offset:4px}
.brand{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.brand svg{fill:currentColor;display:block}
.brand:focus-visible{outline:1px solid currentColor;outline-offset:6px}
/* alleen het woordmerk JP SELECT, net als op mobiel (laptop iets groter) */
.brand>svg:first-child{display:none}
.brand .word{height:16px!important}
.tools{display:flex;justify-content:flex-end;align-items:center;gap:2px}
.langs{display:flex;gap:6px;margin-right:8px}
.langs button{all:unset;cursor:pointer;font:500 10.5px/1 var(--f-sans);letter-spacing:.18em;padding:6px 2px;opacity:.45}
.langs button[aria-pressed="true"]{opacity:1;border-bottom:1px solid currentColor}
/* menu-icoon linksboven op elk scherm; de losse menulinks en NL/EN zitten in het uitklapmenu */
.burger,.msearch{display:grid}
.nav .links,.tools .tsearch,.nav .langs{display:none}
@media (max-width:1040px){
  .nav .row{min-height:54px}
  .nav .links{display:none}
  .burger,.msearch{display:grid}
  .tools .tsearch,.nav .langs{display:none}
  .brand>svg:first-child{display:none}
  .brand .word{height:12px!important}
}
@media (max-width:420px){.tools .acct{display:none}}

/* volledig scherm menu (mobiel) */
.mmenu{position:fixed;inset:0;z-index:80;background:var(--ivory);display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) var(--gutr) 0 var(--gut);visibility:hidden;opacity:0;transition:opacity .45s var(--ease),visibility 0s .45s}
.mmenu.on{visibility:visible;opacity:1;transition:opacity .45s var(--ease)}
.mmenu .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:68px;border-bottom:1px solid var(--line)}
.mmenu .top .icon{justify-self:start;margin-left:-10px}
.mmenu .top .langs{justify-self:end;margin-right:0}
.mlogo{all:unset;cursor:pointer;display:grid;place-items:center;color:var(--char);padding:4px}
.mlogo svg{fill:currentColor;display:block}
.mlogo:focus-visible{outline:1px solid var(--char);outline-offset:4px}
.mmenu .mlist{display:block;align-self:start;margin-top:clamp(10px,2.5vh,26px)}
.mlist>*{transform:translateY(12px);opacity:0;transition:transform .6s var(--ease),opacity .6s var(--ease)}
.mmenu.on .mlist>*{transform:none;opacity:1}
.mmenu.on .mlist>*:nth-child(2){transition-delay:.04s}.mmenu.on .mlist>*:nth-child(3){transition-delay:.08s}.mmenu.on .mlist>*:nth-child(4){transition-delay:.12s}.mmenu.on .mlist>*:nth-child(5){transition-delay:.16s}.mmenu.on .mlist>*:nth-child(6){transition-delay:.2s}
.mrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;min-height:62px;border-bottom:1px solid var(--line);font:400 15px/1 var(--f-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--char)}
.mrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.3;flex:none;transition:transform .35s var(--ease)}
.mrow:focus-visible{outline:1px solid var(--char);outline-offset:-2px}
.mgrp.open>.mrow svg{transform:rotate(90deg)}
.mgrp.open>.mrow{border-bottom-color:transparent}
.msub{display:grid;overflow:hidden;max-height:0;transition:max-height .45s var(--ease)}
.mgrp.open .msub{max-height:220px;border-bottom:1px solid var(--line)}
.msub button{all:unset;cursor:pointer;padding:13px 0 13px 20px;font:400 14px/1 var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.msub button:first-child{padding-top:4px}.msub button:last-child{padding-bottom:20px}
.msub button:hover,.msub button:focus-visible{color:var(--char)}
.mmenu .foot{margin-inline:calc(var(--gut) * -1) calc(var(--gutr) * -1);background:var(--char);color:var(--ivory);display:flex;justify-content:center;align-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));font:500 11.5px/1 var(--f-sans);letter-spacing:.32em;text-transform:uppercase}
/* laptop: hetzelfde menu, als paneel dat van links inschuift */
@media (min-width:1041px){
  .mmenu{inset:0 auto 0 0;width:min(440px,100%);padding:0 40px;opacity:1;transform:translateX(-102%);box-shadow:24px 0 60px rgba(36,36,36,.14);transition:transform .55s var(--ease),visibility 0s .55s}
  .mmenu.on{transform:none;transition:transform .55s var(--ease)}
  .mmenu .top{min-height:72px}
  .mmenu .mlist{margin-top:28px}
  .mrow{min-height:64px}
  .mrow:hover{color:var(--mute)}
  .mmenu .foot{margin-inline:-40px}
}

/* HERO: gelaagd sfeerbeeld in beweging (geen filmopname) */
.hero{position:relative;margin-top:calc(var(--navh,78px)*-1);height:max(620px,min(100svh,1000px));overflow:hidden;isolation:isolate;background:#E4DACB}
.hero .scene,.banner .scene{position:absolute;inset:-6% -6%;z-index:-1}
.scene .l{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform}
.scene .wall{animation:breathe 34s ease-in-out infinite alternate}
.scene .arch{background-size:130% auto;background-repeat:no-repeat;background-position:30% 40%;animation:sun 46s ease-in-out infinite alternate}
.scene .lvb{background-size:120% auto;background-repeat:no-repeat;background-position:60% 0%;transform-origin:85% 0%;animation:sway 13s ease-in-out infinite alternate}
.scene .lva{background-size:112% auto;background-repeat:no-repeat;background-position:70% 0%;transform-origin:90% 0%;animation:sway2 8.5s ease-in-out infinite alternate}
.scene .bloom{background:radial-gradient(60% 55% at 62% 36%,rgba(255,244,222,.55),rgba(255,244,222,0) 70%);mix-blend-mode:soft-light;animation:bloom 18s ease-in-out infinite alternate}
.scene .grain{background-image:url(scene/grain.png);background-size:256px;opacity:.06;mix-blend-mode:multiply}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes sun{from{transform:translate3d(-2.5%,0,0)}to{transform:translate3d(2.5%,1.2%,0)}}
@keyframes sway{0%{transform:rotate(-.8deg) translate3d(0,0,0)}100%{transform:rotate(1deg) translate3d(-14px,8px,0)}}
@keyframes sway2{0%{transform:rotate(.9deg) translate3d(0,0,0)}50%{transform:rotate(-.6deg) translate3d(10px,4px,0)}100%{transform:rotate(1.4deg) translate3d(-6px,10px,0)}}
@keyframes bloom{from{opacity:.75;transform:translate3d(-3%,0,0)}to{opacity:1;transform:translate3d(3%,2%,0)}}
.hmedia{position:absolute;inset:-7% 0 0 0;z-index:-1;will-change:transform}
.hmedia img,.hmedia video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hmedia video{opacity:0;transition:opacity 1.2s ease}
.hmedia video.on{opacity:1}
.hero .veil{position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(246,243,238,.88) 0%,rgba(246,243,238,.62) 34%,rgba(246,243,238,0) 62%),linear-gradient(0deg,rgba(246,243,238,.6),rgba(246,243,238,0) 32%)}
.hero .copy{position:relative;z-index:1;height:100%;display:grid;align-content:end;padding-bottom:clamp(40px,9vh,96px)}
.hero .copy>div{display:grid;gap:22px;max-width:680px}
.hero h1 svg{fill:var(--char);display:block}
.hero .claim{font:400 clamp(30px,3.6vw,58px)/1.02 var(--f-serif);letter-spacing:.05em;text-transform:uppercase}
.hero .quote{font:italic 400 clamp(18px,1.7vw,25px)/1.4 var(--f-serif);color:#4A443C;max-width:26ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.st{opacity:0;animation:rise .9s ease forwards}
.st.d1,.st.d2,.st.d3,.st.d4{animation-delay:0s}
@keyframes rise{to{opacity:1}}
.pause{position:absolute;z-index:2;right:var(--gutr);bottom:clamp(40px,9vh,96px);width:44px;height:44px;border:1px solid rgba(36,36,36,.35);display:grid;place-items:center;cursor:pointer;background:rgba(246,243,238,.4);backdrop-filter:blur(6px)}
@media (min-width:800px){.pause{right:max(40px,env(safe-area-inset-right,0px))}}
.paused .scene .l{animation-play-state:paused}
.scroll-cue{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:1;display:grid;justify-items:center;gap:8px;color:#4A443C}
.scroll-cue i{display:block;width:1px;height:38px;background:linear-gradient(var(--char),transparent);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (min-width:900px){
  .hero{background:var(--ivory)}
  .hero{margin-top:0;height:calc(max(620px,min(100svh,1000px)) - var(--navh,78px))}
  .hero .hmedia{inset:-7% 0 0 50%}
  .hero .scroll-cue{left:25%}
  .hero .veil{display:none}
  /* tekst precies gecentreerd in de lichte linkerhelft */
  .hero .copy{width:50%;max-width:none;margin:0;box-sizing:border-box;padding:0 clamp(32px,4vw,72px);align-content:center;justify-items:center;text-align:center}
  .hero .copy>div{max-width:680px;justify-items:center}
  .hero .claim{white-space:nowrap;font-size:clamp(28px,3.1vw,54px)}
  .hero .quote{margin-inline:auto}
  .hero .ctas{justify-content:center}
  .pause{right:max(40px,env(safe-area-inset-right,0px))}
}
@media (max-width:899px){
  .hero{margin-top:0;height:calc(max(560px,min(100svh,1000px)) - var(--navh,64px))}
  .hero .veil{background:linear-gradient(0deg,rgba(246,243,238,.96) 0%,rgba(246,243,238,.84) 38%,rgba(246,243,238,.35) 56%,rgba(246,243,238,0) 70%)}
  .scroll-cue{display:none}
  .hero .copy>div{gap:16px}
  .hero .claim{margin-top:0;font-size:25px;letter-spacing:.08em}
  .hero .quote{font-size:18px;margin-top:2px}
  .hero .ctas{display:grid;grid-template-columns:1fr;gap:10px;max-width:min(420px,calc(100% - 64px));margin-top:12px}
  .hero .ctas .btn{width:100%;box-sizing:border-box}
}

/* zichtbaar in rust; bij binnenkomen schuift het iets omhoog */
.rv{transition:transform 1.2s var(--ease)}
.js .rv:not(.in){transform:translateY(34px)}
.rv-img{overflow:hidden}
.rv-img img{transition:transform 1.8s var(--ease)}
.js .rv-img:not(.in) img{transform:scale(1.08)}
@media (prefers-reduced-motion:reduce){.scene .l,.st,.scroll-cue i{animation:none!important;opacity:1;transform:none}.js .rv:not(.in),.js .rv-img:not(.in) img{transform:none}}

/* secties */
.sec{padding-block:var(--secY)}
:root{--secY:clamp(84px,12.5vw,180px)}
.eyebrow{display:flex;align-items:center;gap:14px;color:var(--mute)}
.eyebrow::before{content:"";width:34px;height:1px;background:currentColor}
.eyebrow.mid{justify-content:center}
.eyebrow.mid::after{content:"";width:34px;height:1px;background:currentColor}
.philo{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(32px,7vw,120px);align-items:end}
.philo h2{font-size:clamp(38px,5.4vw,78px);line-height:1.02}
.philo h2 em{font-style:italic;color:var(--champ)}
.philo .txt{display:grid;gap:22px;max-width:46ch;color:#4A443C;font-size:17px}
@media (max-width:860px){.philo{grid-template-columns:1fr}}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6vw,22px)}
.cat{all:unset;cursor:pointer;display:grid;gap:14px;align-content:start}
.cat .im{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:var(--stone)}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease),filter .8s}
.cat:hover img{transform:scale(1.05)}
.cat .lbl{position:relative;display:flex;justify-content:center;align-items:baseline;text-align:center;border-bottom:1px solid var(--line2);padding-bottom:12px}
.cat .lbl b{font:400 clamp(20px,1.9vw,27px)/1.1 var(--f-serif)}
.cat .lbl span{position:absolute;right:0;bottom:12px;font-size:18px;transform:translateX(-6px);opacity:0;transition:.5s var(--ease)}
.cat:hover .lbl span{transform:none;opacity:1}
.cat:focus-visible{outline:1px solid var(--char);outline-offset:3px}
@media (max-width:700px){.cats{grid-template-columns:1fr 1fr;row-gap:26px}.cat .im{aspect-ratio:3/4}.cat:nth-child(3){grid-column:1/-1}.cat:nth-child(3) .im{aspect-ratio:4/3}.cat:nth-child(3) img{object-position:50% 12%}.cat .lbl{gap:8px}.cat .lbl b{font-size:min(19px,4.1vw);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}.cat .lbl span{opacity:1;transform:none;flex:none;font-size:16px}}

.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.head .t{display:grid;gap:14px;min-width:0;flex:1 1 300px}
.manifest{max-width:780px;margin-inline:auto;text-align:center;display:grid;justify-items:center;gap:clamp(22px,3vw,34px)}
.manifest .mk{font:italic 400 clamp(15px,1.3vw,18px)/1.4 var(--f-serif);letter-spacing:.14em;color:var(--char)}
.manifest .mt{font:400 clamp(25px,3vw,40px)/1.32 var(--f-serif);color:var(--char);text-wrap:balance}
.manifest .sig{display:grid;gap:10px;justify-items:center;margin-top:4px}
.manifest .sn{font:italic 400 clamp(28px,2.8vw,38px)/1 var(--f-serif);color:var(--char)}
.manifest .sig .cap{font-size:10.5px;letter-spacing:.26em}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:clamp(22px,3vw,36px)}
.shead h2{font:500 clamp(12px,1vw,13.5px)/1.5 var(--f-sans);letter-spacing:.26em;text-transform:uppercase;color:var(--char)}
.shead .lnk{white-space:nowrap}
.head h2{font-size:clamp(34px,4.2vw,58px);line-height:1.04}
.head p{color:var(--mute);max-width:58ch}

/* producttegels */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(28px,3vw,44px) clamp(12px,1.6vw,22px)}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc{display:grid;gap:14px;align-content:start;min-width:0;position:relative}
.pc .ph{all:unset;cursor:pointer;position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:#CFD0D2}
.pc .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease),opacity .6s}
.pc .ph img.alt{position:absolute;inset:0;opacity:0}
.pc:hover .ph img{transform:scale(1.035)}
.pc:hover .ph img.alt{opacity:1}
.pc .ph:focus-visible{outline:1px solid var(--char);outline-offset:3px}
.tag{position:absolute;top:12px;left:12px;font:500 9.5px/1 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;padding:7px 9px;background:rgba(246,243,238,.92);color:var(--char)}
.tag.demo{background:var(--char);color:var(--ivory)}
.tag.soon{background:var(--champ);color:#fff}
.tag.sold{background:rgba(36,36,36,.75);color:#fff}
.demo-ov{position:absolute;inset:30% 0 auto;display:grid;justify-items:center;gap:6px;color:#5E5850;text-align:center}
.demo-ov svg{height:44px;width:auto;fill:#3A3631;opacity:.75}

.info .pr{font-size:22px;font-variant-numeric:tabular-nums}
.info .pr s{font-size:14px;color:var(--mute);margin-left:12px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:12px 28px;margin:0;padding-block:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px}
.spec dt{font:500 10.5px/1.9 var(--f-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.spec dd{margin:0}
.avail{display:flex;gap:10px;align-items:center;font-size:14px}
.avail i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.avail.no i{background:var(--taupe)}
details{border-bottom:1px solid var(--line);padding-block:16px}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font:500 11px/1.4 var(--f-sans);letter-spacing:.2em;text-transform:uppercase}
details summary::after{content:"+";font-size:16px;line-height:1}
details[open] summary::after{content:"–"}
details summary::-webkit-details-marker{display:none}
details p{margin-top:12px;color:#4A443C;font-size:15px;max-width:60ch}
.lb{position:fixed;inset:0;z-index:95;background:rgba(246,243,238,.98);display:grid;place-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.lb img{max-height:92svh;max-width:96vw;object-fit:contain;touch-action:pinch-zoom}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px))}
.lb .prev,.lb .next{position:absolute;top:50%;transform:translateY(-50%)}
.lb .prev{left:calc(10px + env(safe-area-inset-left,0px))}.lb .next{right:calc(10px + env(safe-area-inset-right,0px))}

/* snelle blik */
.modal{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:20px var(--gutr) 20px var(--gut);pointer-events:none}
.modal .box{pointer-events:auto;background:var(--ivory);width:min(940px,100%);max-height:min(90svh,720px);overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);position:relative}
.modal .box .pic{background:#CFD0D2;aspect-ratio:4/5}

.line img{width:72px;height:90px;object-fit:cover;background:#CFD0D2}
.line .nm{display:grid;gap:4px;font-size:14px}
.line .nm b{font:400 18px/1.2 var(--f-serif)}

.tot{display:grid;gap:8px;font-size:14.5px}

/* ---------------- routes ----------------
   Live (jpselect.nl / netlify.app): echte adressen zoals /nl/kleding/ en /product/hogan-...-jp-2610-024/ (vindbaar in Google).
   Prototype (claude.ai): #token zoals voorheen. Adressen, titels en teksten komen uit seo.js (ook gebruikt door de build). */
const SEO=window.JPSEO;
const PATHS=(()=>{try{return !!window.JPS_PATHS||/(^|\.)jpselect\.nl$|\.netlify\.app$/.test(location.hostname)}catch(e){return false}})();
const ROUTES=SEO.ROUTES.nl;
function parseHash(products){const h=(location.hash||'').slice(1).toLowerCase();
  if(ROUTES[h])return {v:ROUTES[h][0],p:ROUTES[h][1]||''};
  if(h.startsWith('merk-'))return {v:'col',p:'brand',b:h.slice(5)};
  if(products.find(x=>x.id===h))return {v:'product',p:h};
  return {v:'home',p:''}}
function hashOf(r){if(r.v==='product')return r.p;if(r.v==='col'&&r.p==='brand')return 'merk-'+r.b;
  const e=Object.entries(ROUTES).find(([k,v])=>v[0]===r.v&&(v[1]||'')===(r.p||''));return e?e[0]:''}
/* huidige route uit het adres; onbekend product -> collectie */
function readRoute(products){
  if(!PATHS)return {r:parseHash(products)};
  const pp=SEO.parsePath(location.pathname,products);const lg=SEO.parseLegacyHash(location.hash,products);
  let r=lg||pp.r;if(r.v==='product'&&!r.p)r={v:'col',p:'all'};
  return {L:pp.L,r}}
/* Afbeeldingen op de live site via Netlify Image CDN: juiste breedte en automatisch WebP/AVIF (sneller op mobiel). Valt terug op het origineel. */
const IM=(src,w)=>(!PATHS||!src||/^(data:|https?:|\/\.netlify)/.test(src))?src:'/.netlify/images?url='+encodeURIComponent('/'+String(src).replace(/^\//,''))+'&w='+w+'&q=78';
const imFallback=e=>{const el=e.currentTarget,o=el.getAttribute('data-o');if(o&&el.getAttribute('src')!==o){el.removeAttribute('srcset');el.setAttribute('src',o)}};
const imp=(src,w)=>({src:IM(src,w),'data-o':src,onError:imFallback});

/* scroll-effecten: navigatie, onthullen, parallax, achtergrondtint */
function useEffects(route,products,L){
  useEffect(()=>{
    const nav=document.querySelector('.nav');
    const setH=()=>{if(nav)document.documentElement.style.setProperty('--navh',nav.offsetHeight+'px')};setH();
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.08});
    document.querySelectorAll('.rv:not(.in),.rv-img:not(.in)').forEach(el=>io.observe(el));
    const tones=[...document.querySelectorAll('[data-tone]')];
    /* achtergrond blijft overal ivoor: geen kleurwissel bij scrollen */
    const tio={disconnect(){}};document.body.style.backgroundColor='#F6F3EE';
    const par=[...document.querySelectorAll('[data-par]')];const hz=null;
    let raf=0;const tick=()=>{raf=0;const y=window.scrollY,vh=window.innerHeight;
      if(!reduced()){par.forEach(el=>{const r=el.parentElement.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;const k=+el.dataset.par;el.style.transform=`translate3d(0,${(-r.top)*k}px,0)`})}
      if(hz){const r=hz.getBoundingClientRect();const tr=hz.querySelector('.track');const max=tr.scrollWidth-tr.clientWidth+Math.min(120,window.innerWidth*.08);
        const prog=Math.min(1,Math.max(0,-r.top/(hz.offsetHeight-vh)));tr.style.transform=`translate3d(${-prog*Math.max(0,max)}px,0,0)`}};
    const on=()=>{if(!raf)raf=requestAnimationFrame(tick)};
    window.addEventListener('scroll',on,{passive:true});window.addEventListener('resize',()=>{setH();on()});tick();
    return()=>{io.disconnect();tio.disconnect();window.removeEventListener('scroll',on)}},[route,products,L]);
}

function toB64(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',q).split(',')[1]}

        ${f.brand==='other'?fld('brandOther',F.other):fld('model',F.model)}

        ${shoe&&html`<div className="fld"><label htmlFor="ti-box">${F.boxQ}</label><select id="ti-box" value=${f.box} onChange=${s('box')}><option value="">${F.boxNone}</option><option value="box">${F.boxBox}</option><option value="both">${F.boxBoth}</option></select></div>`}

/* ---------------- collectie ---------------- */
function Collection({ctx}){const {t,L,products,route,go}=ctx;
  const preset=route.p;const brandSlug=route.b||'';
  const brandName=BRANDS.find(b=>b.toLowerCase().replace(/\s+/g,'-')===brandSlug)||'';
  const init=()=>({cats:(preset==='shoes'||preset==='men-shoes'||preset==='women-shoes')?['sneakers','footwear']:preset==='clothing'?['clothing']:(preset==='men-sneakers'||preset==='women-sneakers')?['sneakers']:[],brands:brandName?[brandName]:[],sizes:[],conds:[],gender:(preset==='men-sneakers'||preset==='men-shoes')?'men':(preset==='women-sneakers'||preset==='women-shoes')?'women':'',price:'all',avail:preset==='new'?['available','coming']:['available','coming','sold'],sort:'new'});
  const [f,setF]=useState(init);const [open,setOpen]=useState(false);
  const pool=products;
  /* alle filters behalve heren/dames: basis voor de lijst én de aantallen bij Alle/Heren/Dames */
  const pre=useMemo(()=>{let l=pool.filter(p=>f.avail.includes(p.status));
    if(f.cats.length)l=l.filter(p=>f.cats.includes(p.category));if(f.brands.length)l=l.filter(p=>f.brands.includes(p.brand));
    if(f.sizes.length)l=l.filter(p=>f.sizes.includes(szl(p,'en')));if(f.conds.length)l=l.filter(p=>f.conds.includes(p.condition));
    if(f.price!=='all'){const [a,b]=f.price.split('-').map(Number);l=l.filter(p=>p.price!=null&&p.price>=a&&p.price<b)}
    return l},[pool,f]);
  const list=useMemo(()=>{let l=[...pre];
    if(f.gender)l=l.filter(p=>p.gender===f.gender);
    const rank={available:0,coming:1,demo:2,sold:3};
    if(f.sort==='low')l.sort((a,b)=>(a.price??1e9)-(b.price??1e9));else if(f.sort==='high')l.sort((a,b)=>(b.price??-1)-(a.price??-1));
    else l.sort((a,b)=>rank[a.status]-rank[b.status]||(a.feat??99)-(b.feat??99)||String(b.soldAt||b.added).localeCompare(String(a.soldAt||a.added)));
    return l},[pre,f.gender,f.sort]);
  const tog=(k,v)=>setF(o=>({...o,[k]:o[k].includes(v)?o[k].filter(x=>x!==v):[...o[k],v]}));
  const sizes=useMemo(()=>[...new Set(pool.filter(p=>f.cats.length?f.cats.includes(p.category):true).filter(p=>p.size).map(p=>szl(p,'en')))].sort((a,b)=>parseFloat(a.replace(/[^\d.]/g,''))-parseFloat(b.replace(/[^\d.]/g,''))||a.localeCompare(b)),[pool,f.cats]);
  const brands=useMemo(()=>[...new Set(pool.map(p=>p.brand))].sort(),[pool]);
  const sneak=preset==='men-sneakers'||preset==='women-sneakers';
  const shoeG=preset==='shoes'||preset==='men-shoes'||preset==='women-shoes';
  const introTxt=SEO.intro(brandName?'brand':preset,brandName,L);
  const title=brandName||(sneak?(f.gender?t.col[f.gender+'-sneakers']:t.col.sneakers):shoeG?(f.gender?t.col[f.gender+'-shoes']:t.col.shoes):t.col[preset])||t.col.all;
  const showG=preset!=='clothing'&&pre.some(p=>p.gender==='men')&&pre.some(p=>p.gender==='women');
  const gcount=g=>g?pre.filter(p=>p.gender===g).length:pre.length;
  const nf=f.cats.length+f.brands.length+f.sizes.length+f.conds.length+(f.gender&&!showG?1:0)+(f.price!=='all'?1:0);
  const chips=(k,opts)=>html`<div className="chips">${opts.map(([v,l])=>html`<button key=${v} type="button" className="chip" aria-pressed=${f[k].includes(v)} onClick=${()=>tog(k,v)}>${l}</button>`)}</div>`;
  return html`<div className="wrap">
    <div className="ph-top"><span className="eyebrow cap">JP SELECT</span><h1>${title}</h1>${introTxt&&html`<p className="colintro">${introTxt}</p>`}
      ${showG&&html`<div className="gseg" role="group" aria-label=${t.fGender}>${[['',t.gAll],['men',t.men],['women',t.women]].map(([v,l])=>html`<button key=${v||'all'} type="button" aria-pressed=${f.gender===v} onClick=${()=>setF(o=>({...o,gender:v}))}>${l}<sup>${gcount(v)}</sup></button>`)}</div>`}</div>
    <div className="toolbar">
      <button className="sel" onClick=${()=>setOpen(true)} aria-expanded=${open}>${t.filters}${nf?' ('+nf+')':''}</button>
      <span className="count">${t.results(list.length)}</span><span className="sp"></span>
      <label className="sr" htmlFor="c-sort">${t.sort}</label>
      <select id="c-sort" className="sel" value=${f.sort} onChange=${e=>setF(o=>({...o,sort:e.target.value}))}><option value="new">${t.sNew}</option><option value="low">${t.sLow}</option><option value="high">${t.sHigh}</option></select>
    </div>
    ${list.length?html`<div className="grid" style=${{paddingBottom:100}}>${list.map(p=>html`<${Card} key=${p.id} ctx=${ctx} p=${p}/>`)}</div>`
      :html`<div className="empty"><p>${t.noRes}</p><button className="btn" onClick=${()=>setF(init())}>${t.clear}</button></div>`}
    <div className=${'scrim'+(open?' on':'')} onClick=${()=>setOpen(false)}></div>
    <aside className=${'panel'+(open?' on':'')} aria-hidden=${!open} aria-label=${t.filters}>
      <header><span className="cap">${t.filters}</span><button className="icon" onClick=${()=>setOpen(false)} aria-label=${t.close}>${Ic.x}</button></header>
      <div className="body">
        <div className="fgroup"><span className="cap mute">${t.fCat}</span>${chips('cats',Object.entries(t.catN))}</div>
        <div className="fgroup"><span className="cap mute">${t.fGender}</span><div className="chips">${[['men',t.men],['women',t.women]].map(([v,l])=>html`<button key=${v} type="button" className="chip" aria-pressed=${f.gender===v} onClick=${()=>setF(o=>({...o,gender:o.gender===v?'':v}))}>${l}</button>`)}</div></div>
        <div className="fgroup"><span className="cap mute">${t.fBrand}</span>${chips('brands',brands.map(b=>[b,b]))}</div>
        <div className="fgroup"><span className="cap mute">${t.fSize}</span>${chips('sizes',sizes.map(s=>[s,s.replace('.',L==='nl'?',':'.')]))}</div>
        <div className="fgroup"><span className="cap mute">${t.fCond}</span>${chips('conds',Object.entries(t.cond))}</div>
        <div className="fgroup"><span className="cap mute">${t.fPrice}</span><div className="chips">${t.price.map(([v,l])=>html`<button key=${v} type="button" className="chip" aria-pressed=${f.price===v} onClick=${()=>setF(o=>({...o,price:v}))}>${l}</button>`)}</div></div>
        <div className="fgroup"><span className="cap mute">${t.fAvail}</span>${chips('avail',Object.entries(t.av))}</div>
      </div>
      <footer><button className="btn solid full" onClick=${()=>setOpen(false)}>${t.show(list.length)}</button><button className="lnk" style=${{justifySelf:'center'}} onClick=${()=>setF(init())}>${t.clear}</button></footer>
    </aside>
  </div>`}

/* ---------------- product ---------------- */
function desc(p,t,L){const n=L==='nl';const base=n?`${p.condition.startsWith('new')?'Nieuw':'Tweedehands'} ${p.brand} ${p.model} in ${p.color[L].toLowerCase()}, maat ${szl(p,L)}. Staat: ${t.cond[p.condition].toLowerCase()}.`
  :`${p.condition.startsWith('new')?'New':'Pre-owned'} ${p.brand} ${p.model} in ${p.color[L].toLowerCase()}, size ${szl(p,L)}. Condition: ${t.cond[p.condition].toLowerCase()}.`;
  return base+(p.note?' '+p.note[L]:'')}
function Buy({ctx,p}){const {t,L,add,bag,open}=ctx;
  if(p.demo)return html`<button className="btn full" disabled>${t.demoBtn}</button>`;

  if(p.status==='sold')return html`<button className="btn full" disabled>${t.soldBtn}</button>`;
  if(bag.includes(p.id))return html`<button className="btn full" onClick=${()=>open('bag')}>${t.inBag} ✓</button>`;
  return html`<button className="btn solid full" onClick=${()=>add(p)}>${t.add} · ${fmt(p.price,L)}</button>`}
function Product({ctx}){const {t,L,products,route,go}=ctx;const p=products.find(x=>x.id===route.p);
  const [gi,setGi]=useState(0);const [zoom,setZoom]=useState(false);const [lb,setLb]=useState(false);const zr=useRef(null);

  if(!p)return html`<div className="wrap empty"><p>${t.noRes}</p></div>`;
  const rel=products.filter(x=>x.id!==p.id&&x.status!=='sold'&&(x.category===p.category||x.brand===p.brand)).slice(0,4);
  const move=e=>{if(!zoom||!zr.current)return;const r=zr.current.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;zr.current.querySelector('img').style.transformOrigin=x+'% '+y+'%'};
  const fine=(()=>{try{return matchMedia('(hover:hover) and (pointer:fine)').matches}catch(e){return false}})();
  return html`<div className="wrap">
    <nav className="crumbs" aria-label="Kruimelpad"><button onClick=${()=>go({v:'col',p:'all'})}>${t.col.all}</button><span>/</span><button onClick=${()=>go({v:'col',p:'brand',b:p.brand.toLowerCase().replace(/\s+/g,'-')})}>${p.brand}</button><span>/</span><span>${p.model}</span></nav>
    <div className="pd">
      <div className="gallery">
        ${p.images.length>1?html`<div className="thumbs2">${p.images.map((src,i)=>html`<button key=${src} aria-current=${i===gi} aria-label=${'Foto '+(i+1)} onClick=${()=>setGi(i)}><img ...${imp(src,240)} alt=""/></button>`)}</div>`:html`<div></div>`}
        <div className=${'zoom'+(zoom?' on':'')} ref=${zr} onMouseEnter=${()=>fine&&setZoom(true)} onMouseLeave=${()=>setZoom(false)} onMouseMove=${move} onClick=${()=>setLb(true)} role="button" tabIndex="0" aria-label=${t.zoom} onKeyDown=${e=>{if(e.key==='Enter')setLb(true)}}>
          <img ...${imp(p.images[gi],1200)} alt=${p.brand+' '+p.model}/>
          ${(p.demo||p.nophoto)&&html`<div className="demo-ov"><${Mono} h=${64}/><span className="cap">${p.demo?t.photoFollows:t.photoSoon}</span></div>`}
          <span className="hint">${t.zoom}</span></div>
      </div>
      <div className="info">
        <div style=${{display:'grid',gap:12}}><span className="cap">${p.brand}${p.demo?' · '+t.tagDemo:''}</span><h1>${p.model}</h1>
          <div className="pr">${fmt(p.price,L)||t.priceTba}${p.retail&&html`<s>${t.retail} ${fmt(p.retail,L)}</s>`}</div></div>
        <div className=${'avail'+(p.status==='available'?'':' no')}><i></i><span>${t.pAvail[p.status]}</span></div>
        <dl className="spec"><dt>${t.pSize}</dt><dd>${szl(p,L)}</dd><dt>${t.pCond}</dt><dd>${t.cond[p.condition]} · ${p.condition.startsWith('new')?t.isNew:t.pre}</dd><dt>${t.pColor}</dt><dd>${p.color[L]}</dd>${p.material&&html`<dt>${t.pMat}</dt><dd>${p.material[L]}</dd>`}<dt>${t.pSku}</dt><dd>${p.sku}</dd></dl>
        <${Buy} ctx=${ctx} p=${p}/>
        <a className="rateln" href="#reviews"><${Stars} v=${REV.score} size=${13}/><span>${t.revLine.replace('{s}',rnum(REV.score,L)).replace('{n}',REV.count)}</span></a>
        ${(p.status==='coming'||p.demo)&&html`<p className="ph-note">${p.demo?t.demoNote:t.soonNote}</p>`}
        <div><details open><summary>${t.descT}</summary><p>${desc(p,t,L)}</p></details>
          <details><summary>${t.shipT}</summary><p>${t.shipP}</p></details>
          <details><summary>${t.vatT}</summary><p>${t.vatP}</p></details></div>
      </div>
    </div>
    ${rel.length>0&&html`<section style=${{paddingBottom:100}}><div className="head"><div className="t"><h2 style=${{fontSize:'clamp(28px,3vw,40px)'}}>${t.related}</h2></div></div><div className="grid">${rel.map(x=>html`<${Card} key=${x.id} ctx=${ctx} p=${x}/>`)}</div></section>`}
    ${lb&&html`<div className="lb" role="dialog" aria-label=${p.brand+' '+p.model}>
      <img ...${imp(p.images[gi],1600)} alt=${p.brand+' '+p.model}/>
      <button className="icon x" onClick=${()=>setLb(false)} aria-label=${t.close}>${Ic.x}</button>
      ${p.images.length>1&&html`<button className="icon prev" onClick=${()=>setGi((gi-1+p.images.length)%p.images.length)} aria-label="Vorige">${Ic.l}</button><button className="icon next" onClick=${()=>setGi((gi+1)%p.images.length)} aria-label="Volgende">${Ic.r}</button>`}
    </div>`}
  </div>`}

function Quick({ctx,id}){const {t,L,products,go,close}=ctx;const p=products.find(x=>x.id===id);if(!p)return null;
  return html`<div className="modal" role="dialog" aria-label=${p.brand+' '+p.model}><div className="box">
    <div className="pic" style=${{position:'relative'}}><img ...${imp(p.images[0],900)} alt=""/>${(p.demo||p.nophoto)&&html`<div className="demo-ov"><${Mono} h=${50}/><span className="cap" style=${{fontSize:9.5}}>${p.demo?t.photoFollows:t.photoSoon}</span></div>`}</div>
    <div className="in"><span className="cap">${p.brand}${p.demo?' · '+t.tagDemo:''}</span><h2 style=${{fontSize:34,lineHeight:1.05}}>${p.model}</h2>
      <div style=${{fontSize:19}}>${fmt(p.price,L)||t.priceTba}</div>
      <dl className="spec"><dt>${t.pSize}</dt><dd>${szl(p,L)}</dd><dt>${t.pCond}</dt><dd>${t.cond[p.condition]}</dd><dt>${t.pColor}</dt><dd>${p.color[L]}</dd></dl>
      <${Buy} ctx=${ctx} p=${p}/>
      <button className="lnk" style=${{justifySelf:'start'}} onClick=${()=>go({v:'product',p:p.id})}>${t.details}</button>
    </div>
    <button className="icon x" onClick=${close} aria-label=${t.close}>${Ic.x}</button>
  </div></div>`}

/* ---------------- tas ---------------- */
function Bag({ctx}){const {t,L,products,bag,rm,ui,close,go}=ctx;const items=bag.map(id=>products.find(p=>p.id===id)).filter(Boolean);const sub=items.reduce((a,p)=>a+(p.price||0),0);
  return html`<aside className=${'panel right'+(ui.bag?' on':'')} aria-hidden=${!ui.bag} aria-label=${t.bagT}>
    <header><span className="cap">${t.bagT} (${items.length})</span><button className="icon" onClick=${close} aria-label=${t.close} tabIndex=${ui.bag?0:-1}>${Ic.x}</button></header>
    <div className="body">${items.length?items.map(p=>html`<div className="line" key=${p.id}><img ...${imp(p.images[0],400)} alt=""/><div className="nm"><span className="cap" style=${{fontSize:9.5}}>${p.brand}</span><b>${p.model}</b><span className="mute">${szl(p,L)} · ${t.cond[p.condition]}</span><span className="mute" style=${{fontSize:12}}>${t.unique}</span><button className="rm" onClick=${()=>rm(p.id)}>${t.remove}</button></div><span>${fmt(p.price,L)}</span></div>`)
      :html`<div className="empty" style=${{padding:'50px 0'}}><p>${t.bagEmpty}</p><button className="btn" onClick=${()=>go({v:'col',p:'all'})}>${t.continue}</button></div>`}</div>
    ${items.length>0&&html`<footer><div className="tot"><div><span>${t.sub}</span><span>${fmt(sub,L)}</span></div><div className="mute"><span>${t.shipCalc}</span><span>${t.shipLater}</span></div></div><button className="btn solid full" onClick=${()=>go({v:'checkout'})}>${t.checkout}</button></footer>`}
  </aside>`}

function Checkout({ctx}){const {t,L,products,bag,go}=ctx;const items=bag.map(id=>products.find(p=>p.id===id)).filter(Boolean);const sub=items.reduce((a,p)=>a+(p.price||0),0);
  const [f,setF]=useState({name:'',email:'',street:'',zip:'',city:'',country:'NL'});const [err,setErr]=useState({});const [step,setStep]=useState('form');
  const s=k=>e=>setF(o=>({...o,[k]:e.target.value}));
  const next=e=>{e.preventDefault();const er={};['name','street','zip','city'].forEach(k=>{if(!f[k].trim())er[k]=t.form.req});if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim()))er.email=t.form.badMail;setErr(er);if(!Object.keys(er).length)setStep('pay')};
  if(!items.length)return html`<div className="wrap text"><h1>${t.coH}</h1><p>${t.coEmpty}</p><div><button className="btn" onClick=${()=>go({v:'col',p:'all'})}>${t.continue}</button></div></div>`;
  const fld=(k,label,full,ac,type)=>html`<div className=${'fld'+(full?' full':'')}><label htmlFor=${'co-'+k}>${label}</label><input id=${'co-'+k} type=${type||'text'} autoComplete=${ac} value=${f[k]} onInput=${s(k)} aria-invalid=${err[k]?'true':null}/>${err[k]&&html`<span className="err">${err[k]}</span>`}</div>`;
  return html`<div className="wrap co">
    <div style=${{display:'grid',gap:24}}><span className="eyebrow cap">${t.coDemo}</span><h1 style=${{fontSize:'clamp(40px,5vw,64px)'}}>${t.coH}</h1><p className="ph-note">${t.coIntro}</p>
      ${step==='form'?html`<form className="form" onSubmit=${next} noValidate><span className="cap full">${t.coDetails}</span>${fld('name',t.coName,true,'name')}${fld('email',t.coEmail,true,'email','email')}${fld('street',t.coStreet,true,'street-address')}${fld('zip',t.coZip,false,'postal-code')}${fld('city',t.coCity,false,'address-level2')}
        <div className="fld full"><label htmlFor="co-country">${t.coCountry}</label><select id="co-country" value=${f.country} onChange=${s('country')}>${Object.entries(t.countries).map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select></div>
        <div className="full"><button className="btn solid full" type="submit">${t.coNext}</button></div></form>`
      :html`<div className="okbox"><span className="cap" style=${{color:'var(--champ)'}}>Prototype</span><h3 style=${{fontSize:26}}>${t.coPayH}</h3><p className="mute">${t.coPayP}</p><p style=${{fontSize:14}}>${f.name} · ${f.email}<br/>${f.street}, ${f.zip} ${f.city}, ${t.countries[f.country]}</p><div><button className="btn" onClick=${()=>setStep('form')}>${t.coEdit}</button></div></div>`}
    </div>
    <aside className="sum"><span className="cap">${t.coSum}</span>${items.map(p=>html`<div className="line" key=${p.id} style=${{paddingBlock:10}}><img ...${imp(p.images[0],400)} alt=""/><div className="nm"><span className="cap" style=${{fontSize:9.5}}>${p.brand}</span><b>${p.model}</b><span className="mute">${szl(p,L)}</span></div><span>${fmt(p.price,L)}</span></div>`)}
      <div className="tot"><div><span>${t.sub}</span><span>${fmt(sub,L)}</span></div><div className="mute"><span>${t.shipCalc}</span><span>${t.placeholder}</span></div><div className="g"><span>${t.total}</span><span>${fmt(sub,L)} + ${L==='nl'?'verzending':'shipping'}</span></div><p className="mute" style=${{fontSize:12.5}}>${t.vatP}</p></div></aside>
  </div>`}

/* ---------------- zoeken ---------------- */
function Search({ctx}){const {t,L,products,ui,close,go}=ctx;const [q,setQ]=useState('');const ref=useRef(null);
  useEffect(()=>{if(ui.search)setTimeout(()=>ref.current&&ref.current.focus(),250);else setQ('')},[ui.search]);
  const res=useMemo(()=>{const s=q.trim().toLowerCase();if(!s)return [];return products.filter(p=>p.status!=='sold').filter(p=>[p.brand,p.model,p.sku,szl(p,'en'),p.color.nl,p.color.en,t.catN[p.category]].join(' ').toLowerCase().includes(s)).slice(0,12)},[q,products,L]);
  return html`<div className=${'search'+(ui.search?' on':'')} aria-hidden=${!ui.search} role="dialog" aria-label=${t.search}><div className="wrap">
    <div className="bar"><label className="sr" htmlFor="q">${t.sH}</label><input id="q" ref=${ref} value=${q} onInput=${e=>setQ(e.target.value)} placeholder=${t.sH} autoComplete="off" tabIndex=${ui.search?0:-1}/><button className="icon" onClick=${close} aria-label=${t.close} tabIndex=${ui.search?0:-1}>${Ic.x}</button></div>
    ${q.trim()?(res.length?html`<div className="res">${res.map(p=>html`<button key=${p.id} onClick=${()=>go({v:'product',p:p.id})}><img ...${imp(p.images[0],400)} alt=""/><span><span className="cap" style=${{fontSize:9.5}}>${p.brand}${p.demo?' · Demo':''}</span><b>${p.model}</b><span className="mute" style=${{fontSize:13}}>${szl(p,L)} · ${fmt(p.price,L)||t.priceTba}</span></span></button>`)}</div>`:html`<p className="mute" style=${{paddingBlock:'10px 30px'}}>${t.sNone}</p>`):html`<p className="mute" style=${{paddingBlock:'10px 30px'}}>${t.sTips}</p>`}
  </div></div>`}

/* ---------------- losse pagina's ---------------- */
function BrandsPage({ctx}){const {t,products,go}=ctx;const counts={};products.filter(p=>p.status!=='sold').forEach(p=>{counts[p.brand]=(counts[p.brand]||0)+1});
  return html`<div className="wrap sec" style=${{display:'grid',gap:50}}><div className="ph-top" style=${{padding:0,justifyItems:'center',textAlign:'center'}}><span className="eyebrow cap mid">${t.brandsEy}</span><h1>${t.brandsH}</h1></div>
    <div className="brands">${BRANDS.map(b=>html`<button key=${b} onClick=${()=>go({v:'col',p:'brand',b:b.toLowerCase().replace(/\s+/g,'-')})}>${b}<small>${counts[b]?t.items(counts[b]):t.noneYet}</small></button>`)}</div>
    <p className="mute" style=${{textAlign:'center',fontSize:13}}>${t.brandsNote}</p></div>`}
function StoryPage({ctx}){const {t}=ctx;return html`<${Fragment}><section className="wrap sec"><${StoryBlock} ctx=${ctx}/></section><${Approach} ctx=${ctx}/><section className="wrap sec"><div className="philo"><div style=${{display:'grid',gap:28}}><span className="eyebrow cap">${t.philoEy}</span><h2 dangerouslySetInnerHTML=${{__html:t.philoH}}></h2></div><div className="txt">${t.philoP.map((x,i)=>html`<p key=${i}>${x}</p>`)}</div></div></section><//>`}
function SellPage({ctx}){return html`<section className="wrap sec" style=${{paddingTop:'clamp(36px,4.5vw,64px)'}}><${TradeIn} ctx=${ctx}/></section>`}
function Info({ctx,k}){const {t,say}=ctx;const body={ship:t.shipBody,terms:t.termsBody,privacy:t.privacyBody,contact:t.contactBody}[k]||[];
  const copy=()=>{try{navigator.clipboard.writeText(CO.email).then(()=>say(t.copied),()=>say(t.copyFail))}catch(e){say(t.copyFail)}};
  return html`<div className="wrap"><div className="text"><span className="eyebrow cap">JP SELECT</span><h1>${t.pages[k]||''}</h1>${body.map((x,i)=>html`<p key=${i}>${x}</p>`)}
    ${k==='contact'&&html`<div style=${{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}><code style=${{fontSize:18,userSelect:'all'}}>${CO.email}</code><button className="btn" style=${{minHeight:40}} onClick=${copy}>${t.copy}</button></div><p className="mute" style=${{fontSize:14}}>${t.f.kvk} ${CO.kvk} · ${t.f.btw} ${CO.btw} · ${CO.city}</p>`}
    ${(k==='terms'||k==='privacy')&&html`<p className="ph-note">${t.placeholder}</p>`}</div></div>`}

function Footer({ctx}){const {t,go,say}=ctx;const [m,setM]=useState('');
  const L2=(label,r)=>html`<li><button className="fl" onClick=${()=>go(r)}>${label}</button></li>`;
  return html`<footer className="foot"><div className="wrap">
    <div className="top">
      <div className="news"><${Word} h=${13}/><h4 style=${{marginTop:18}}>${t.f.news}</h4><p>${t.f.newsP}</p><form onSubmit=${e=>{e.preventDefault();say(t.f.newsOk);setM('')}}><label className="sr" htmlFor="nl-mail">${t.f.newsPh}</label><input id="nl-mail" type="email" placeholder=${t.f.newsPh} value=${m} onInput=${e=>setM(e.target.value)}/><button type="submit">${t.f.newsBtn}</button></form></div>
      <div><h4>${t.f.shop}</h4><ul>${L2(t.f.all,{v:'col',p:'all'})}${L2(t.nav.new,{v:'col',p:'new'})}${L2(t.nav.shoes,{v:'col',p:'shoes'})}${L2(t.nav.clothing,{v:'col',p:'clothing'})}${L2(t.nav.brands,{v:'brands'})}</ul></div>
      <div><h4>${t.f.about}</h4><ul>${L2(t.nav.story,{v:'story'})}${L2(t.nav.sell,{v:'sell'})}${L2(t.revEy,{v:'reviews'})}${L2(t.f.contact,{v:'info',p:'contact'})}<li><span className="fl" style=${{cursor:'default',color:'#9C9387'}}>${t.f.instaSoon}</span></li></ul></div>
      <div><h4>${t.f.service}</h4><ul>${L2(t.f.ship,{v:'info',p:'ship'})}${L2(t.f.terms,{v:'info',p:'terms'})}${L2(t.f.privacy,{v:'info',p:'privacy'})}</ul></div>
    </div>
    <div className="bot"><span>© 2026 JP SELECT · ${t.f.kvk} ${CO.kvk} · ${t.f.btw} ${CO.btw}</span><span>Trade in. Step up.</span></div>
  </div></footer>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
